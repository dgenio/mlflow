name: Export source for contribution

on:
  push:
    branches:
      - feat/oss-eval-dataset-versions

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package source
        run: |
          tar --exclude=.git --exclude=.github/workflows/export-source-for-chatgpt.yml -czf /tmp/mlflow-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: mlflow-source
          path: /tmp/mlflow-source.tar.gz
          retention-days: 1
