name: Test OSS evaluation dataset versions

on:
  push:
    branches:
      - feat/oss-eval-dataset-versions

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply working patch
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/storage.patch
          git apply --check /tmp/storage.patch
          git apply /tmp/storage.patch
      - name: Compile changed Python
        run: python -m py_compile mlflow/store/tracking/dbmodels/models.py mlflow/store/tracking/sqlalchemy_store.py mlflow/store/tracking/abstract_store.py mlflow/store/db_migrations/versions/c4f8e2a71b93_add_evaluation_dataset_versions.py
      - name: Install MLflow and pytest
        run: python -m pip install -e . pytest
      - name: Run evaluation dataset store tests
        run: pytest -q tests/store/tracking/sqlalchemy_store/test_sqlalchemy_store_eval_datasets.py
