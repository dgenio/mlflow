name: Apply and validate OSS evaluation dataset versions

on:
  push:
    branches:
      - feat/oss-eval-dataset-versions

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Apply contribution patch
        shell: bash
        run: |
          base64 -d .chatgpt/patch.b64 | gzip -d > /tmp/oss-eval-versions.patch
          git apply --check /tmp/oss-eval-versions.patch
          git apply /tmp/oss-eval-versions.patch
          rm -rf .chatgpt
          rm -f .github/workflows/export-source-for-chatgpt.yml
          rm -f .github/workflows/test-oss-eval-dataset-versions.yml
          rm -f .github/workflows/apply-oss-eval-dataset-versions.yml
      - name: Compile changed Python
        run: |
          python -m py_compile \
            mlflow/store/tracking/dbmodels/models.py \
            mlflow/store/tracking/sqlalchemy_store.py \
            mlflow/store/tracking/abstract_store.py \
            mlflow/store/tracking/sqlalchemy_workspace_store.py \
            mlflow/data/evaluation_dataset_source.py \
            mlflow/entities/evaluation_dataset.py \
            mlflow/genai/datasets/evaluation_dataset.py \
            mlflow/genai/datasets/__init__.py \
            mlflow/store/tracking/rest_store.py \
            mlflow/tracking/_tracking_service/client.py \
            mlflow/tracking/client.py \
            mlflow/server/handlers.py \
            mlflow/store/db_migrations/versions/c4a9f33e8b71_add_evaluation_dataset_versions.py
      - name: Generate protobuf outputs
        run: ./dev/generate-protos.sh
      - name: Install MLflow and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run focused tests
        run: |
          pytest -q tests/store/tracking/sqlalchemy_store/test_sqlalchemy_store_eval_datasets.py
          pytest -q tests/genai/datasets/test_evaluation_dataset.py
          pytest -q tests/store/tracking/test_rest_store.py -k dataset
          pytest -q tests/server/test_handlers.py -k dataset
      - name: Commit validated working state
        shell: bash
        run: |
          git config user.name 'Diogo Santos'
          git config user.email 'diogofcul@hotmail.com'
          git add -A
          git commit -m 'feat: add immutable OSS evaluation dataset versions'
          git push origin HEAD:feat/oss-eval-dataset-versions
